<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f23">
<title>GrowMyPin Client Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f4f0;
  --card: #ffffff;
  --card-2: #f8f9f6;
  --ink: #1c1f23;
  --ink-2: #4b5058;
  --muted: #8a8f97;
  --line: rgba(28,31,35,0.09);
  --line-2: rgba(28,31,35,0.16);
  --brand: #19a463;
  --brand-ink: #0d6e40;
  --brand-soft: #e3f5ea;
  --charcoal: #1c1f23;
  --charcoal-2: #2a2e34;
  --good: #19a463;
  --good-soft: #e3f5ea;
  --warn: #c77a0a;
  --warn-soft: #fdf1dc;
  --bad: #d64545;
  --bad-soft: #fce8e8;
  --info: #3b6fd8;
  --info-soft: #e7eefc;
  --neutral-soft: #eef0ec;
  --shadow: 0 1px 2px rgba(20,22,26,0.04), 0 4px 16px rgba(20,22,26,0.05);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416;
    --card: #1b1e22;
    --card-2: #22262b;
    --ink: #eef0f2;
    --ink-2: #b9bec6;
    --muted: #7d838c;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.15);
    --brand-soft: #143826;
    --brand-ink: #5fd59a;
    --good-soft: #143826;
    --warn-soft: #3a2a0e;
    --bad-soft: #3d1a1a;
    --info-soft: #182742;
    --neutral-soft: #262a30;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"] {
  --bg: #121416;
  --card: #1b1e22;
  --card-2: #22262b;
  --ink: #eef0f2;
  --ink-2: #b9bec6;
  --muted: #7d838c;
  --line: rgba(255,255,255,0.08);
  --line-2: rgba(255,255,255,0.15);
  --brand-soft: #143826;
  --brand-ink: #5fd59a;
  --good-soft: #143826;
  --warn-soft: #3a2a0e;
  --bad-soft: #3d1a1a;
  --info-soft: #182742;
  --neutral-soft: #262a30;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }
svg.ic { width: 18px; height: 18px; flex-shrink: 0; }
.hidden { display: none !important; }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--charcoal);
  color: #fff;
  padding-top: env(safe-area-inset-top, 0px);
}
.bar {
  max-width: 1180px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; flex-shrink: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: #fff; display: grid; place-items: center; }
.brand-mark svg { width: 24px; height: 24px; }
.brand-name { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; line-height: 1.1; }
.brand-name span { color: #3fd68a; }
.brand-sub { font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 500; }
.nav { display: flex; gap: 4px; margin-left: 12px; background: rgba(255,255,255,0.06); padding: 4px; border-radius: 12px; }
.nav-btn {
  border: 0; background: transparent; color: rgba(255,255,255,0.7);
  height: 34px; padding: 0 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 7px;
}
.nav-btn svg.ic { width: 16px; height: 16px; }
.nav-btn:hover { color: #fff; }
.nav-btn.active { background: #fff; color: var(--charcoal); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.65); white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fd68a; box-shadow: 0 0 0 3px rgba(63,214,138,0.18); }
.sync.saving .dot { background: #f2b33d; box-shadow: 0 0 0 3px rgba(242,179,61,0.2); animation: pulse 1s infinite; }
.sync.error .dot { background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,107,107,0.2); }
@keyframes pulse { 50% { opacity: 0.4; } }
.hbtn {
  height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14);
  background: transparent; color: #fff; padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.hbtn:hover { background: rgba(255,255,255,0.08); }
.hbtn.brand-btn { background: var(--brand); border-color: var(--brand); }
.hbtn.brand-btn:hover { background: #158f56; }

/* ---------- Layout ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 110px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.page-sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.grid { display: grid; gap: 14px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-title { font-size: 15px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
.card-note { font-size: 12px; color: var(--muted); }
.section { margin-top: 14px; }

/* ---------- KPI ---------- */
.kpi { position: relative; overflow: hidden; }
.kpi .k-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; }
.kpi .k-val { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 4px; line-height: 1.1; }
.kpi .k-foot { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi.hero { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
.kpi.hero .k-label { color: rgba(255,255,255,0.6); }
.kpi.hero .k-foot { color: rgba(255,255,255,0.75); }
.kpi.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(63,214,138,0.35), rgba(63,214,138,0) 70%);
}
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12px; padding: 2px 7px; border-radius: 20px; }
.delta.up { background: var(--good-soft); color: var(--good); }
.delta.down { background: var(--bad-soft); color: var(--bad); }
.delta.flat { background: var(--neutral-soft); color: var(--ink-2); }
.kpi.hero .delta.up { background: rgba(63,214,138,0.16); color: #3fd68a; }
.kpi.hero .delta.down { background: rgba(255,107,107,0.16); color: #ff8a8a; }
.kpi.hero .delta.flat { background: rgba(255,255,255,0.1); color: #fff; }

.mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.mini > div { padding: 4px 14px; border-left: 1px solid var(--line); }
.mini > div:first-child { border-left: 0; padding-left: 0; }
.mini .m-val { font-size: 20px; font-weight: 800; }
.mini .m-label { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ---------- Pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill .pd { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-lead { background: var(--info-soft); color: var(--info); }
.s-trial { background: var(--warn-soft); color: var(--warn); }
.s-active { background: var(--good-soft); color: var(--good); }
.s-churned { background: var(--neutral-soft); color: var(--muted); }
.t-good { color: var(--good); }
.t-warn { color: var(--warn); }
.t-bad { color: var(--bad); }
.t-info { color: var(--info); }
.t-muted { color: var(--muted); }

/* ---------- Buttons & inputs ---------- */
.btn {
  height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card);
  padding: 0 14px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  transition: background 0.15s, transform 0.05s;
}
.btn:hover { background: var(--card-2); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #158f56; }
.btn.dark { background: var(--charcoal); border-color: var(--charcoal); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 12px; border-radius: 9px; }
.btn.icon { width: 32px; padding: 0; }
.btn:disabled { opacity: 0.55; cursor: default; }
input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], select, textarea {
  height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card);
  padding: 0 12px; width: 100%; outline: none;
}
textarea { height: auto; padding: 10px 12px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(25,164,99,0.15); }
.btn:focus-visible, .chip:focus-visible, .nav-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.search-box { position: relative; flex: 1; min-width: 200px; }
.search-box svg { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.search-box input { padding-left: 38px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 32px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--card);
  padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip .cnt { background: var(--neutral-soft); color: var(--ink-2); border-radius: 10px; padding: 0 6px; font-size: 11px; line-height: 18px; }
.chip.active { background: var(--charcoal); border-color: var(--charcoal); color: #fff; }
.chip.active .cnt { background: rgba(255,255,255,0.18); color: #fff; }
.sort-select { width: auto; min-width: 170px; }

/* ---------- Attention list ---------- */
.alert-list { display: flex; flex-direction: column; gap: 8px; }
.alert {
  display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px;
  background: var(--card-2); border: 1px solid var(--line);
}
.alert .a-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.alert.bad .a-ic { background: var(--bad-soft); color: var(--bad); }
.alert.warn .a-ic { background: var(--warn-soft); color: var(--warn); }
.alert.info .a-ic { background: var(--info-soft); color: var(--info); }
.alert.good .a-ic { background: var(--good-soft); color: var(--good); }
.alert .a-body { flex: 1; min-width: 0; }
.alert .a-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.alert .a-name:hover { text-decoration: underline; }
.alert .a-text { font-size: 12px; color: var(--ink-2); }
.alert .a-act { display: flex; gap: 6px; flex-shrink: 0; }
.empty-state { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty-state .e-ic { width: 46px; height: 46px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin: 0 auto 10px; }
.empty-state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }

/* ---------- Funnel ---------- */
.funnel-bar { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: var(--neutral-soft); margin: 4px 0 14px; }
.funnel-bar > div { height: 100%; transition: width 0.4s; }
.funnel-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fl-item { padding: 10px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); cursor: pointer; }
.fl-item:hover { border-color: var(--line-2); }
.fl-item .fl-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.fl-item .fl-sw { width: 8px; height: 8px; border-radius: 3px; }
.fl-item .fl-val { font-size: 22px; font-weight: 800; margin-top: 2px; }

/* ---------- Bars list ---------- */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row .br-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.bar-row .br-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .br-val { font-weight: 700; flex-shrink: 0; }
.bar-track { height: 8px; border-radius: 6px; background: var(--neutral-soft); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; background: var(--brand); }

/* ---------- Client cards ---------- */
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.cc { display: flex; flex-direction: column; gap: 14px; transition: border-color 0.15s, transform 0.15s; }
.cc:hover { border-color: var(--line-2); transform: translateY(-1px); }
.cc-top { display: flex; align-items: flex-start; gap: 12px; }
.avatar { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; flex-shrink: 0; }
.cc-id { flex: 1; min-width: 0; cursor: pointer; }
.cc-name { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-contact { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border-radius: 12px; background: var(--card-2); }
.cc-stats .s-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.cc-stats .s-val { font-size: 18px; font-weight: 800; margin-top: 2px; }
.cc-stats .s-sub { font-size: 12px; color: var(--ink-2); }
.cc-health { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
.health { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.health .hd { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.cc-actions { display: flex; gap: 8px; }
.cc-actions .btn { flex: 1; }

/* ---------- Table ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .right { text-align: right; }
.tx-in { color: var(--good); font-weight: 700; }
.tx-out { color: var(--bad); font-weight: 700; }
.tx-type { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.tx-dot { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.tx-dot.in { background: var(--good-soft); color: var(--good); }
.tx-dot.out { background: var(--bad-soft); color: var(--bad); }
.tx-dot.ref { background: var(--warn-soft); color: var(--warn); }
.tx-dot svg.ic { width: 15px; height: 15px; }

/* ---------- Charts ---------- */
.chart-box { position: relative; width: 100%; height: 280px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- Drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(12,14,16,0.5); z-index: 40; opacity: 0; transition: opacity 0.2s; }
.scrim.show { opacity: 1; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); z-index: 41;
  transform: translateX(100%); transition: transform 0.25s ease; display: flex; flex-direction: column;
  box-shadow: -10px 0 40px rgba(0,0,0,0.2);
}
.drawer.show { transform: translateX(0); }
.drawer-head { background: var(--charcoal); color: #fff; padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 18px; }
.drawer-head .dh-top { display: flex; align-items: flex-start; gap: 12px; }
.drawer-head .dh-name { font-size: 20px; font-weight: 800; line-height: 1.2; word-break: break-word; }
.drawer-head .dh-contact { font-size: 13px; color: rgba(255,255,255,0.6); }
.drawer-head .close-x { margin-left: auto; background: rgba(255,255,255,0.1); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
.dh-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.dh-stats > div { background: rgba(255,255,255,0.07); border-radius: 12px; padding: 10px; }
.dh-stats .l { font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.dh-stats .v { font-size: 17px; font-weight: 800; margin-top: 2px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px)); }
.d-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.health-banner { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
.health-banner.good { background: var(--good-soft); color: var(--good); }
.health-banner.warn { background: var(--warn-soft); color: var(--warn); }
.health-banner.bad { background: var(--bad-soft); color: var(--bad); }
.health-banner.info { background: var(--info-soft); color: var(--info); }
.health-banner.muted { background: var(--neutral-soft); color: var(--ink-2); }
.pay-list { display: flex; flex-direction: column; }
.pay-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pay-item:last-child { border-bottom: 0; }
.pay-item .pi-body { flex: 1; min-width: 0; }
.pay-item .btn.icon + .btn.icon { margin-left: -4px; }
.pay-item .pi-amt { font-weight: 800; font-size: 15px; }
.pay-item .pi-meta { font-size: 12px; color: var(--muted); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line-2); border-radius: 2px; }
.tl-item { position: relative; padding: 0 0 14px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item .tl-dot { position: absolute; left: -22px; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--bg); }
.tl-item .tl-title { font-weight: 700; font-size: 13px; }
.tl-item .tl-date { font-size: 12px; color: var(--muted); }

/* ---------- Modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(12,14,16,0.55); animation: fade 0.15s; }
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--card); border-radius: 20px; width: 100%; max-width: 460px; max-height: calc(100vh - 32px);
  display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: pop 0.18s ease;
}
@keyframes pop { from { transform: translateY(10px) scale(0.98); opacity: 0; } }
.modal-head { padding: 18px 20px 6px; display: flex; align-items: flex-start; gap: 10px; }
.modal-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
.modal-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

// ================= Billing engine =================
function isMilestone(p) { return /milestone/i.test(String(p.note || "")); }
function detectPlan(c) {
  var m = c.meta || {};
  if (m.plan && PLANS[m.plan]) return m.plan;
  var firstPlanPay = (c.payments || []).filter(function (p) { return (Number(p.amount) || 0) > 0 && !isMilestone(p); })
    .sort(function (a, b) { return String(a.date || "").localeCompare(String(b.date || "")); })[0];
  if (firstPlanPay && Number(firstPlanPay.amount) === 499) return "old";
  var lock = (c.payments || []).some(function (p) { return Number(p.amount) === 2999 || /lock/i.test(String(p.note || "")); });
  return lock ? "lockin" : "standard";
}
function planUpfront(plan, meta) {
  if (plan === "lockin") return 3998;
  if (plan === "custom") return Number(meta.amount) || 0;
  if (plan === "old") return meta.upfront != null ? (Number(meta.upfront) || 0) : oldGuessUpfront(meta);
  return 999;
}
function oldGuessUpfront(meta) { return meta && meta._guess ? meta._guess : 499; }
function planCharge(plan, k, meta) {
  if (plan === "lockin") return k % 3 === 0 ? 2999 : 0;
  if (plan === "custom") return Number(meta.amount) || 0;
  if (plan === "old") return Number(meta.amount) || 0;
  return k === 1 ? 4000 : 999;
}
function chargeName(plan, k) {
  if (k === 0) return plan === "lockin" ? "Upfront + lock-in" : plan === "old" ? "Old offer charge" : "Upfront charge";
  if (plan === "lockin") return "Lock-in renewal";
  if (plan === "standard" && k === 1) return "Month 1 charge";
  return "Month " + (k + 1) + " base charge";
}
// Every paying client runs in 30-day months counted from their first payment
// (or the billing start date set on the client). Each month end has a fixed
// charge from the plan. Milestone payments are tracked separately.
function billing(c) {
  var today = todayKey();
  var meta = c.meta || {};
  var plan = detectPlan(c);
  if (plan === "old" && meta.upfront == null) meta = Object.assign({}, meta, { _guess: 499 });
  var pays = (c.payments || []).filter(function (p) { return p.date && p.date <= today; });
  var firstPaid = pays.filter(function (p) { return (Number(p.amount) || 0) > 0; }).map(function (p) { return p.date; }).sort()[0];
  var b = { plan: plan, planLabel: PLANS[plan].label, anchor: meta.billingStart || firstPaid || null, milestones: 0 };
  if (!b.anchor) return b;
  var paidPlan = 0;
  pays.forEach(function (p) {
    var a = Number(p.amount) || 0;
    if (isMilestone(p)) { if (a > 0) b.milestones += a; }
    else paidPlan += a;
  });
  var daysSince = Math.max(0, daysBetween(b.anchor, today));
  var kPassed = Math.floor(daysSince / CYCLE_DAYS);
  var upfront = planUpfront(plan, meta);
  var expectedNow = upfront;
  for (var j = 1; j <= kPassed; j++) expectedNow += planCharge(plan, j, meta);
  var outstanding = Math.max(0, expectedNow - paidPlan);
  var overdueSince = null, overdueK = null;
  if (outstanding > 0) {
    var cum = upfront;
    if (cum > paidPlan) { overdueSince = b.anchor; overdueK = 0; }
    else {
      for (var i = 1; i <= kPassed; i++) {
        cum += planCharge(plan, i, meta);
        if (cum > paidPlan) { overdueSince = addDays(b.anchor, CYCLE_DAYS * i); overdueK = i; break; }
      }
    }
  }
  var credit = Math.max(0, paidPlan - expectedNow);
  var k = kPassed + 1;
  var nextCharge = planCharge(plan, k, meta);
  b.month = k;
  b.dayInMonth = daysSince - kPassed * CYCLE_DAYS + 1;
  b.progress = Math.min(1, (daysSince - kPassed * CYCLE_DAYS) / CYCLE_DAYS);
  b.nextDate = addDays(b.anchor, CYCLE_DAYS * k);
  b.daysLeft = daysBetween(today, b.nextDate);
  b.nextCharge = nextCharge;
  b.nextAmount = Math.max(0, nextCharge - credit);
  b.nextName = chargeName(plan, k);
  b.outstanding = outstanding;
  b.overdueSince = overdueSince;
  b.overdueK = overdueK;
  b.overdueName = overdueK === null ? "" : chargeName(plan, overdueK);
  b.daysOver = overdueSince ? Math.max(0, daysBetween(overdueSince, today)) : 0;
  b.paidPlan = paidPlan;
  b.expected = expectedNow;
  b.credit = credit;
  // state for UI
  if (outstanding > 0 && b.daysOver > 0) b.state = "over";
  else if (outstanding > 0) b.state = "today";
  else if (b.nextAmount > 0 && b.daysLeft <= DUE_SOON_DAYS) b.state = "soon";

}
function monthEndedLabel(b) {

}
function billLine(b) {

  if (b.state === "today") return b.overdueK === 0 ? "Upfront payment pending" : "Month " + b.overdueK + " completes today";
  if (b.nextAmount > 0) return "Month " + b.month + " ends in " + plural(b.daysLeft, "day");

}

// ================= Derived info =================
function info(c) {
  var today = todayKey();
  var pays = (c.payments || []).slice().sort(function (a, b) { return String(a.date || "").localeCompare(String(b.date || "")); });
  var revenue = 0, refunds = 0, paidCount = 0, last = null, upcoming = [], first = null;
  pays.forEach(function (p) {
    var amt = Number(p.amount) || 0;
    if (amt > 0 && p.date && p.date > today) { upcoming.push(p); return; }
    revenue += amt;
    if (amt < 0) refunds += -amt;
    if (amt > 0) { paidCount++; last = p; if (!first) first = p; }
  });
  var hist = c.statusHistory || [];
  var statusSince = c.createdAt || today;
  for (var i = hist.length - 1; i >= 0; i--) {
    if (hist[i].status === c.status) statusSince = hist[i].date;
    else break;
  }
  var trialEntry = hist.find(function (h) { return h.status === "trial"; });
  var firstTrial = trialEntry ? trialEntry.date : c.createdAt;
  var everActive = paidCount > 0 || hist.some(function (h) { return h.status === "active"; }) || c.status === "active";
  var everTrial = c.status !== "lead" || hist.some(function (h) { return h.status !== "lead"; });
  var daysSincePaid = last ? daysBetween(last.date, today) : null;
  var daysInStatus = Math.max(0, daysBetween(statusSince, today));
  var age = Math.max(0, daysBetween(c.createdAt, today));
  var h;
  if (c.status === "lead") {
    h = daysInStatus >= 5 ? { tone: "warn", label: "Going cold", text: "Lead for " + plural(daysInStatus, "day") + ". Follow up today." }
                          : { tone: "info", label: "New lead", text: "Added " + ago(daysInStatus) + ". Pitch the free trial." };
  } else if (c.status === "trial") {
    var over = daysInStatus - TRIAL_DAYS;
    h = daysInStatus >= TRIAL_DAYS
      ? { tone: "bad", label: "Trial ended", text: over > 0 ? "Trial ended " + plural(over, "day") + " ago. Convert or close." : "Trial ends today. Ask for the payment." }
      : { tone: "warn", label: "Trial day " + (daysInStatus + 1) + "/" + TRIAL_DAYS, text: "Trial day " + (daysInStatus + 1) + " of " + TRIAL_DAYS + ". Share early results." };
  } else if (c.status === "active") {
    var bl = billing(c);
    if (!bl.anchor) h = { tone: "bad", label: "No payment logged", text: "Active but no payment recorded yet." };
    else if (bl.state === "over") h = { tone: "bad", label: plural(bl.daysOver, "day") + " over", text: monthEndedLabel(bl) + " " + plural(bl.daysOver, "day") + " ago. Collect " + money(bl.outstanding) + "." };
    else if (bl.state === "today") h = { tone: "warn", label: "Due today", text: (bl.overdueK === 0 ? "Upfront payment" : "Month " + bl.overdueK + " ends today") + ". Collect " + money(bl.outstanding) + "." };
    else if (bl.state === "soon") h = { tone: "warn", label: plural(bl.daysLeft, "day") + " left", text: "Month " + bl.month + " ends in " + plural(bl.daysLeft, "day") + ". " + money(bl.nextAmount) + " due on " + fmtShort(bl.nextDate) + "." };
    else h = { tone: "good", label: "On track", text: "Month " + bl.month + ", day " + bl.dayInMonth + " of " + CYCLE_DAYS + ". " + (bl.nextAmount > 0 ? money(bl.nextAmount) + " due on " + fmtShort(bl.nextDate) + "." : "Milestones only this month.") };
  } else {
    h = { tone: "muted", label: "Churned", text: "Left on " + fmtDate(c.churnDate || c.updatedAt) + (c.churnReason ? " - " + c.churnReason : "") + "." };
  }
  return {
    revenue: revenue, refunds: refunds, paidCount: paidCount, last: last, first: first, upcoming: upcoming,
    daysSincePaid: daysSincePaid, daysInStatus: daysInStatus, age: age, firstTrial: firstTrial,

}
function attentionRank(c, inf) {

function incomeEntries() {
  var out = [];
  var today = todayKey();
  clients.forEach(function (c) {
    (c.payments || []).forEach(function (p, idx) {
      if ((Number(p.amount) || 0) > 0 && p.date && p.date > today) return;
      out.push({ kind: "income", amount: Number(p.amount) || 0, date: p.date, source: c.name, clientId: c.id, idx: idx, note: p.note || "" });
    });

function getAlerts() {

    if (!isBilling && (t === "bad" || t === "warn" || c.status === "trial")) {

    });

function getCollections() {

    .sort(function (a, b) {

      var rb = b.b.state === "over" ? 0 : b.b.state === "today" ? 1 : 2;

      if (ra === 0) return b.b.daysOver - a.b.daysOver;

function reducedMotion() {

function animateCounts(root) {
  Array.prototype.forEach.call(root.querySelectorAll("[data-count]"), function (el) {
    var target = Number(el.getAttribute("data-count")) || 0;
    var fmt = el.getAttribute("data-fmt") || "int";
    var finalHtml = el.innerHTML;
    var start = null, dur = 750;
    function show(v) {
      el.textContent = fmt === "money" ? money(v) : fmt === "pct" ? Math.round(v) + "%" : String(Math.round(v));
    }
    function step(ts) {
      if (!start) start = ts;
      var t = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      if (t < 1) { show(target * e); requestAnimationFrame(step); }
      else el.innerHTML = finalHtml;
    }
    show(0);
    requestAnimationFrame(step);
  });
}

// ================= Overview =================
function renderOverview() {
  var today = todayKey();
  var mk = monthKey(today);
  var monthStart = mk + "-01";
  var prev = parseKey(monthStart); prev.setMonth(prev.getMonth() - 1);
  var prevStart = dateKey(prev);
  var prevLastDay = new Date(prev.getFullYear(), prev.getMonth() + 1, 0).getDate();
  var prevSameDay = addDays(prevStart, Math.min(parseKey(today).getDate(), prevLastDay) - 1);
  var inc = incomeEntries();

  var revThis = sumInRange(inc, monthStart, today);
  var revPrev = sumInRange(inc, prevStart, prevSameDay);
  var expThis = sumInRange(expenses, monthStart, today);
  var profitThis = revThis - expThis;
  var deltaPct = revPrev > 0 ? Math.round(((revThis - revPrev) / revPrev) * 100) : null;

  var counts = { lead: 0, trial: 0, active: 0, churned: 0 };
  var lifetime = 0, payers = 0, everTrial = 0, everActive = 0, newActiveThisMonth = 0;
  clients.forEach(function (c) {
    counts[c.status] = (counts[c.status] || 0) + 1;
    var inf = info(c);
    lifetime += inf.revenue;
    if (inf.paidCount > 0) payers++;
    if (inf.everTrial) everTrial++;
    if (inf.everActive) everActive++;
    if ((c.statusHistory || []).some(function (h) { return h.status === "active" && h.date >= monthStart; })) newActiveThisMonth++;
  });
  var arpc = payers > 0 ? lifetime / payers : 0;
  var conv = pct(everActive, everTrial);
  var churnRate = pct(counts.churned, counts.active + counts.churned);
  var alerts = getAlerts();
  var cols = getCollections();
  var overdueTotal = 0, overdueCount = 0, due7 = 0, due30 = 0;
  cols.forEach(function (x) {
    if (x.b.outstanding > 0) { overdueTotal += x.b.outstanding; overdueCount++; }
    else {
      if (x.b.nextAmount > 0 && x.b.daysLeft <= 7) due7 += x.b.nextAmount;
      if (x.b.nextAmount > 0 && x.b.daysLeft <= 30) due30 += x.b.nextAmount;
    }
  });

function greeting() {

function miniStat(val, label, cls) {

// ================= Clients =================
function renderClients() {
  var all = clients.map(function (c) { return { c: c, inf: info(c) }; });
  var counts = { open: 0, attention: 0, lead: 0, trial: 0, active: 0, churned: 0, all: all.length };
  all.forEach(function (x) {
    counts[x.c.status] = (counts[x.c.status] || 0) + 1;
    if (x.c.status !== "churned") counts.open++;
    if (x.c.status !== "churned" && (x.inf.health.tone === "bad" || x.inf.health.tone === "warn")) counts.attention++;
  });

  var q = ui.search.toLowerCase();
  var list = all.filter(function (x) {
    var c = x.c, f = ui.clientFilter;
    var okF = f === "all" || (f === "open" && c.status !== "churned") ||
      (f === "attention" && c.status !== "churned" && (x.inf.health.tone === "bad" || x.inf.health.tone === "warn")) || c.status === f;
    var okQ = !q || String(c.name || "").toLowerCase().indexOf(q) > -1 || String(c.email || "").toLowerCase().indexOf(q) > -1;
    return okF && okQ;
  });
  var s = ui.clientSort;
  list.sort(function (a, b) {
    if (s === "revenue") return b.inf.revenue - a.inf.revenue;
    if (s === "name") return String(a.c.name).localeCompare(String(b.c.name));
    if (s === "newest") return String(b.c.createdAt || "").localeCompare(String(a.c.createdAt || ""));
    if (s === "updated") return String(b.c.updatedAt || "").localeCompare(String(a.c.updatedAt || ""));
    return attentionRank(a.c, a.inf) - attentionRank(b.c, b.inf) || (b.inf.daysSincePaid || 0) - (a.inf.daysSincePaid || 0);
  });

  var filters = [["open", "All open"], ["attention", "Needs attention"], ["lead", "Leads"], ["trial", "Trial"], ["active", "Active"], ["churned", "Churned"], ["all", "Everything"]];
  var html = '<div class="page-head"><div><h1 class="page-title">Clients</h1><p class="page-sub">' + plural(counts.active, "paying client") + ', ' + counts.trial + ' on trial, ' + plural(counts.lead, "lead") + '</p></div>' +
    '<div style="display:flex;gap:8px"><button class="btn" type="button" onclick="exportClientsCSV()">' + icon("download") + '<span class="hide-m">Export</span></button><button class="btn primary hide-m" type="button" onclick="openAddClient()">' + icon("plus") + 'Add client</button></div></div>';

  html += '<div class="toolbar"><div class="search-box">' + icon("search") + '<input type="search" id="clientSearch" placeholder="Search by name, email or phone" value="' + esc(ui.search) + '"></div>' +
    '<select class="sort-select" id="clientSort">' +
    [["attention", "Sort: Needs attention first"], ["revenue", "Sort: Highest paid"], ["updated", "Sort: Recently updated"], ["newest", "Sort: Newest first"], ["name", "Sort: Name A-Z"]].map(function (o) {
      return '<option value="' + o[0] + '"' + (ui.clientSort === o[0] ? " selected" : "") + '>' + o[1] + '</option>';
    }).join("") + '</select></div>';

  html += '<div class="chips" style="margin-bottom:16px">' + filters.map(function (f) {
    return '<button class="chip' + (ui.clientFilter === f[0] ? " active" : "") + '" type="button" onclick="ui.clientFilter=\'' + f[0] + '\';renderClients()">' + f[1] + '<span class="cnt">' + (counts[f[0]] || 0) + '</span></button>';
  }).join("") + '</div>';

  if (list.length === 0) {
    html += '<div class="card"><div class="empty-state"><div class="e-ic">' + icon("users") + '</div><b>No clients here</b>' + (clients.length ? "Try another filter or search." : "Add your first client to get started.") + '<div style="margin-top:12px"><button class="btn primary" type="button" onclick="openAddClient()">' + icon("plus") + 'Add client</button></div></div></div>';
  } else {
    html += '<div class="client-grid">' + list.map(clientCard).join("") + '</div>';
  }
  document.getElementById("view-clients").innerHTML = html;

  var sEl = document.getElementById("clientSearch");
  sEl.addEventListener("input", function () {
    ui.search = sEl.value;
    var pos = sEl.selectionStart;
    renderClients();
    var n = document.getElementById("clientSearch");
    n.focus();
    try { n.setSelectionRange(pos, pos); } catch (e) {}
  });
  document.getElementById("clientSort").addEventListener("change", function (e) { ui.clientSort = e.target.value; renderClients(); });
}

      var amt = Number(x.p.amount) || 0, fut = x.p.date > today;

        '<div class="pi-body"><div class="pi-amt num ' + (amt < 0 ? "t-bad" : "") + '">' + money(amt) + (fut ? ' <span class="pill s-lead" style="height:20px;font-size:11px">Upcoming</span>' : "") + '</div>' +
        '<div class="pi-meta">' + fmtDate(x.p.date) + (x.p.note ? " &middot; " + esc(x.p.note) : "") + '</div></div>' +
        '<button class="btn sm icon" type="button" onclick="openEditPayment(\'' + id + '\',' + x.i + ')" aria-label="Edit payment">' + icon("edit") + '</button>' +
        '<button class="btn sm icon" type="button" onclick="confirmDeletePayment(\'' + id + '\',' + x.i + ')" aria-label="Delete payment">' + icon("trash") + '</button></div>';
    }).join("") + '</div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="card-head"><h3 class="card-title">' + icon("clock") + 'Timeline</h3></div><div class="timeline">' + tl.map(function (t) {

  }).join("") + '</div></div>';

}

// ================= Modals =================
function openModal(title, sub, body, foot) {
  var html = '<div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">' +
    '<div class="modal-head"><div><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><button class="close-x" type="button" onclick="closeModal()" aria-label="Close">' + icon("x") + '</button></div>' +
    '<div class="modal-body">' + body + '</div><div class="modal-foot">' + foot + '</div></div></div>';
  document.getElementById("modalRoot").innerHTML = html;
  var first = document.querySelector("#modalRoot input:not([type=hidden]), #modalRoot select");
  if (first && window.innerWidth > 760) setTimeout(function () { first.focus(); }, 30);
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
function showErr(id, msg) { var e = document.getElementById(id); if (e) e.textContent = msg; }
function val(id) { var e = document.getElementById(id); return e ? String(e.value).trim() : ""; }
function segHtml(id, options, current) {
  return '<div class="seg" id="' + id + '" data-value="' + esc(current) + '">' + options.map(function (o) {
    return '<button type="button" class="' + (o[0] === current ? "on" : "") + '" data-v="' + esc(o[0]) + '" onclick="segPick(\'' + id + '\',this)">' + o[1] + '</button>';
  }).join("") + '</div>';
}
function segPick(id, btn) {
  var wrap = document.getElementById(id);
  wrap.dataset.value = btn.getAttribute("data-v");
  Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.classList.toggle("on", b === btn); });
  if (id === "st_seg") { toggleChurnReason(); onStageSegChange(); }
  if (id === "pl_seg") togglePlanFields();
}
function segVal(id) { var w = document.getElementById(id); return w ? w.dataset.value : ""; }
// Index of the history entry where the client's CURRENT stage started
function stageStartIndex(c) {
  var hist = c.statusHistory || [];
  var idx = -1;
  for (var i = hist.length - 1; i >= 0; i--) {
    if (hist[i].status === c.status) idx = i;
    else break;
  }
  return idx;
}
function stageStartDate(c) {
  var i = stageStartIndex(c);
  return i >= 0 ? c.statusHistory[i].date : (c.createdAt || todayKey());
}
function dateChips(inputId) {
  var opts = [[0, "Today"], [1, "Yesterday"], [2, "2 days ago"], [3, "3 days ago"], [7, "1 week ago"]];
  return '<div class="chips" style="margin-bottom:8px">' + opts.map(function (o) {
    return '<button type="button" class="chip" onclick="setDateInput(\'' + inputId + '\',' + o[0] + ',this)">' + o[1] + '</button>';
  }).join("") + '</div>';
}
function setDateInput(inputId, daysAgo, btn) {
  var el = document.getElementById(inputId);
  if (el) { el.value = addDays(todayKey(), -daysAgo); el.dispatchEvent(new Event("change")); }
  if (btn) Array.prototype.forEach.call(btn.parentNode.querySelectorAll(".chip"), function (b) { b.classList.toggle("active", b === btn); });
}
function quickPayHtml(amountId, noteId) {
  return '<div class="quick">' + QUICK_PAYMENTS.map(function (q) {
    return '<button type="button" onclick="pickQuick(this,\'' + amountId + '\',\'' + noteId + '\',' + q[0] + ',\'' + q[1] + '\')"><b class="num">' + money(q[0]) + '</b><small>' + q[1] + '</small></button>';
  }).join("") + '</div>';
}
function pickQuick(btn, amountId, noteId, amt, note) {
  document.getElementById(amountId).value = amt;
  var n = document.getElementById(noteId);
  if (n) n.value = note;
  Array.prototype.forEach.call(btn.parentNode.querySelectorAll("button"), function (b) { b.classList.toggle("on", b === btn); });
}

}
function saveNewClient() {
  var name = val("f_name");
  if (!name) return showErr("f_err", "Client name is required.");
  var status = segVal("f_status") || "lead";
  var amount = Number(val("f_amount"));
  var now = todayKey();
  var since = val("f_since") || now;
  var pdate = val("f_pdate") || now;
  if (amount > 0 && pdate < since) since = pdate;
  var c = { id: uid("c"), name: name, email: val("f_email"), status: status, payments: [], statusHistory: [{ status: status, date: since }], createdAt: since, updatedAt: now };
  if (amount > 0) {
    c.payments.push({ amount: amount, date: pdate, note: val("f_pnote") });
    if (status !== "active" && pdate <= now) { c.status = "active"; c.statusHistory.push({ status: "active", date: pdate }); }
  }
  clients.push(c);
  saveClient(c, name + " added");
  closeModal();
  refresh();
}

// ---- Status ----
function openStatusModal(id, preset) {
  var c = findClient(id); if (!c) return;
  var cur = preset || c.status;
  var since = c.status === "churned" && c.churnDate ? c.churnDate : stageStartDate(c);
  var body =
    '<div class="field"><label>Stage</label>' + segHtml("st_seg", [["lead", "Lead"], ["trial", "Trial"], ["active", "Paying"], ["churned", "Churned"]], cur) + '</div>' +
    '<div class="field"><label for="st_date" id="st_date_label">' + (cur === c.status ? "Stage started on" : "Date") + '</label>' + dateChips("st_date") +
    '<input type="date" id="st_date" data-cur="' + esc(c.status) + '" data-since="' + esc(since) + '" value="' + esc(cur === c.status ? since : todayKey()) + '">' +
    '<div class="hint" id="st_hint">' + (cur === c.status ? "Keep the same stage and change this date to fix when it started." : "") + '</div></div>' +
    '<div class="field" id="st_reason_wrap"><label for="st_reason">Why did they leave?</label><select id="st_reason">' +
    CHURN_REASONS.map(function (r) { return '<option value="' + r + '"' + (c.churnReason === r ? " selected" : "") + '>' + r + '</option>'; }).join("") + '</select></div>';
  openModal("Change stage", esc(c.name) + " is currently " + (STATUS[c.status] || STATUS.lead).label, body,
    '<button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="button" onclick="saveStatus(\'' + esc(id) + '\')">Update</button>');
  toggleChurnReason();
}
function toggleChurnReason() {
  var w = document.getElementById("st_reason_wrap");
  if (w) w.style.display = segVal("st_seg") === "churned" ? "block" : "none";
}
function onStageSegChange() {
  var d = document.getElementById("st_date"); if (!d) return;
  var same = segVal("st_seg") === d.getAttribute("data-cur");
  d.value = same ? d.getAttribute("data-since") : todayKey();
  document.getElementById("st_date_label").textContent = same ? "Stage started on" : "Date";
  document.getElementById("st_hint").textContent = same ? "Keep the same stage and change this date to fix when it started." : "";
}
function saveStatus(id) {
  var c = findClient(id); if (!c) return;
  var s = segVal("st_seg");
  var date = val("st_date") || todayKey();
  if (s === c.status) {
    // Same stage: fix the date this stage started
    c.statusHistory = c.statusHistory || [];
    var i = stageStartIndex(c);
    if (i >= 0) c.statusHistory[i].date = date;
    else c.statusHistory.push({ status: s, date: date });
    if (s === "churned") { c.churnDate = date; c.churnReason = val("st_reason") || c.churnReason; }
    if (date < (c.createdAt || date)) c.createdAt = date;
    c.updatedAt = todayKey();
    saveClient(c, STATUS[s].label + " start date set to " + fmtDate(date));
    closeModal();
    refresh();
    return;
  }
  if (date < (c.createdAt || date)) c.createdAt = date;
  c.status = s;
  if (s === "churned") { c.churnReason = val("st_reason"); c.churnDate = date; }
  else { c.churnReason = null; c.churnDate = null; }
  c.statusHistory = c.statusHistory || [];
  c.statusHistory.push({ status: s, date: date });
  c.updatedAt = todayKey();
  saveClient(c, c.name + " moved to " + STATUS[s].label);
  closeModal();
  refresh();
}

// ---- Payment ----
function suggestPayment(c) {
  var b = billing(c);
  if (!b.anchor) {
    var pl = detectPlan(c);
    var up = planUpfront(pl, c.meta || {});
    return up > 0 ? { amount: up, note: pl === "lockin" ? "Upfront + 3-month lock-in" : pl === "old" ? "Old offer charge" : "Base charge", why: "First payment for the " + PLANS[pl].label + " plan" } : null;
  }
  if (c.status !== "active") return null;
  if (b.outstanding > 0) return { amount: b.outstanding, note: b.overdueName, why: b.state === "over" ? monthEndedLabel(b) + " " + plural(b.daysOver, "day") + " ago" : "Due today" };
  if (b.nextAmount > 0 && b.daysLeft <= 7) return { amount: b.nextAmount, note: b.nextName, why: "Due on " + fmtShort(b.nextDate) + " (" + plural(b.daysLeft, "day") + " left)" };
  return null;
}
function openPaymentModal(id) {
  var c = findClient(id); if (!c) return;
  var sug = suggestPayment(c);
  var body =
    (sug ? '<div class="note-box">' + icon("spark") + ' Suggested: ' + money(sug.amount) + ' &middot; ' + esc(sug.why) + '</div>' : '') +
    '<div class="field"><label>Quick pick</label>' + quickPayHtml("p_amount", "p_note") + '</div>' +
    '<div class="field"><label for="p_amount">Amount</label><div class="amount-input"><span>' + RS + '</span><input type="number" id="p_amount" inputmode="numeric" placeholder="999" value="' + (sug ? sug.amount : "") + '"></div></div>' +
    '<div class="field"><label for="p_date">Payment date</label>' + dateChips("p_date") + '<input type="date" id="p_date" value="' + todayKey() + '"><div class="hint">Pick the day the money actually came. Older dates are fine. A future date shows it as expected.</div></div>' +
    '<div class="field"><label for="p_note">Note</label><input type="text" id="p_note" placeholder="e.g. Month 2 base charge" value="' + (sug ? esc(sug.note) : "") + '"></div>' +
    '<div class="err" id="p_err"></div>';
  openModal("Log payment", esc(c.name) + " &middot; " + money(info(c).revenue) + " paid so far", body,
    '<button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="button" onclick="savePayment(\'' + esc(id) + '\')">' + icon("check") + 'Save payment</button>');
}
function savePayment(id) {
  var c = findClient(id); if (!c) return;
  var amount = Number(val("p_amount"));
  var date = val("p_date");
  if (!amount || amount <= 0) return showErr("p_err", "Enter a valid amount.");
  if (!date) return showErr("p_err", "Pick a date.");
  c.payments = c.payments || [];
  c.payments.push({ amount: amount, date: date, note: val("p_note") });
  if (date < (c.createdAt || date)) c.createdAt = date;
  if ((c.status === "trial" || c.status === "lead") && date <= todayKey()) {
    c.status = "active";
    c.statusHistory = c.statusHistory || [];
    c.statusHistory.push({ status: "active", date: date });
  }
  c.updatedAt = todayKey();
  saveClient(c, money(amount) + " logged for " + c.name);
  closeModal();
  refresh();
}

function togglePlanFields() {
  var v = segVal("pl_seg");
  var w = document.getElementById("pl_amt_wrap");
  if (w) w.style.display = (v === "custom" || v === "old") ? "block" : "none";
  var u = document.getElementById("pl_up_wrap");
  if (u) u.style.display = v === "old" ? "block" : "none";
  var lb = document.getElementById("pl_amt_label");
  if (lb) lb.textContent = v === "old" ? "Monthly base (leave empty or 0 if milestones only)" : "Monthly amount";

function savePlan(id) {
  var c = findClient(id); if (!c) return;
  var plan = segVal("pl_seg");
  var amount = Number(val("pl_amount"));
  if (plan === "custom" && !(amount > 0)) return showErr("pl_err", "Enter the monthly amount.");
  var upfront = Number(val("pl_upfront"));
  if (plan === "old" && !(upfront > 0)) return showErr("pl_err", "Enter the old offer upfront amount (499 or 999).");
  var start = val("pl_start");
  if (!start) return showErr("pl_err", "Pick a billing start date.");
  c.meta = Object.assign({}, c.meta || {}, { plan: plan, amount: plan === "custom" ? amount : plan === "old" ? (amount > 0 ? amount : 0) : null, upfront: plan === "old" ? upfront : null, billingStart: start });
  c.updatedAt = todayKey();
  saveClient(c, "Plan saved for " + c.name);
  closeModal();
  refresh();
}

function saveEditPayment(id, idx) {

// ---- Deletes ----
function confirmDeletePayment(id, idx) {
  var c = findClient(id); if (!c || !c.payments || !c.payments[idx]) return;

var RANGES = [["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["month", "This month"], ["year", "This year"], ["all", "All time"]];
function rangeBounds(r) {
  var today = todayKey();
  if (r === "month") return { from: monthKey(today) + "-01", to: today };
  if (r === "year") return { from: today.slice(0, 4) + "-01-01", to: today };
  if (r === "all") {
    var keys = incomeEntries().map(function (e) { return e.date; }).concat(expenses.map(function (e) { return e.date; })).filter(Boolean).sort();
    return { from: keys.length ? keys[0] : today, to: keys.length && keys[keys.length - 1] > today ? keys[keys.length - 1] : today };
  }
  return { from: addDays(today, -(Number(r) - 1)), to: today };
}
function bucketMode(from, to) {
  var span = daysBetween(from, to) + 1;
  return span <= 45 ? "day" : span <= 180 ? "week" : "month";
}
function bucketKey(key, mode) {
  if (mode === "day") return key;
  if (mode === "month") return monthKey(key);
  var d = parseKey(key);
  var dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return dateKey(d);
}
function bucketLabel(k, mode) {
  if (mode === "month") return monthLabel(k);
  return fmtShort(k);
}
function buildBuckets(from, to, mode) {
  var keys = [], seen = {};
  var cur = parseKey(from), end = parseKey(to);
  while (cur <= end) {
    var k = bucketKey(dateKey(cur), mode);
    if (!seen[k]) { seen[k] = 1; keys.push(k); }
    cur.setDate(cur.getDate() + 1);
  }
  return keys;
}

  expenses.forEach(function (e) { if (e.date >= b.from && e.date <= b.to) { var k = bucketKey(e.date, mode); exp[k] = (exp[k] || 0) + e.amount; } });

function drawProfitChart(b) {
  killChart("profit");
  var el = document.getElementById("chProfit");
  if (!el || !window.Chart) return;
  var mode = bucketMode(b.from, b.to);
  var keys = buildBuckets(b.from, b.to, mode);
  var all = incomeEntries().map(function (e) { return { d: e.date, v: e.amount }; })
    .concat(expenses.map(function (e) { return { d: e.date, v: -e.amount }; }))
    .filter(function (x) { return x.d; })
    .sort(function (a, c) { return String(a.d).localeCompare(String(c.d)); });
  var running = 0, idx = 0, vals = [];
  keys.forEach(function (k, i) {
    var endKey = i < keys.length - 1 ? addDays(mode === "month" ? keys[i + 1] + "-01" : keys[i + 1], -1) : b.to;
    while (idx < all.length && all[idx].d <= endKey) { running += all[idx].v; idx++; }
    vals.push(running);
  });
  var brand = cssVar("--brand", "#19a463");
  var ctx = el.getContext("2d");
  var grad = ctx.createLinearGradient(0, 0, 0, el.clientHeight || 260);
  grad.addColorStop(0, "rgba(25,164,99,0.28)");
  grad.addColorStop(1, "rgba(25,164,99,0)");
  var opts = chartBase();
  opts.scales.y.beginAtZero = false;
  opts.plugins.tooltip.callbacks.label = function (it) { return " Total profit: " + money(it.parsed.y); };
  charts.profit = new Chart(el, {
    type: "line",
    data: {
      labels: keys.map(function (k) { return (mode === "week" ? "Wk " : "") + bucketLabel(k, mode); }),
      datasets: [{
        label: "Profit", data: vals, borderColor: brand, backgroundColor: grad, fill: true, borderWidth: 2.5,
        pointRadius: keys.length > 40 ? 0 : 3, pointHoverRadius: 5, tension: 0.3,
        segment: { borderColor: function (s) { return s.p1.parsed.y < s.p0.parsed.y ? cssVar("--bad", "#d64545") : brand; } }
      }]
    },
    options: opts
  });
}

// ================= Export =================
function downloadCSV(name, header, rows) {
  var csv = [header].concat(rows).map(function (r) {
    return r.map(function (v) { return '"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function exportClientsCSV() {
  downloadCSV("growmypin_clients_" + todayKey() + ".csv",
    ["Name", "Contact", "Status", "Health", "Plan", "Billing month", "Days left", "Days over", "To collect now", "Next charge", "Next due date", "Total paid", "Payments", "Last payment date", "Churn reason", "Added on"],
    clients.map(function (c) {
      var i = info(c), b = i.bill && i.bill.anchor ? i.bill : null;
      return [c.name, c.email || "", c.status, i.health.label, b ? b.planLabel : "", b ? b.month : "", b && b.state !== "over" ? b.daysLeft : "", b ? b.daysOver : "", b ? b.outstanding : "", b ? b.nextAmount : "", b ? b.nextDate : "", i.revenue, i.paidCount, i.last ? i.last.date : "", c.churnReason || "", c.createdAt];
    }));
}
function exportMoneyCSV() {
  var rows = incomeEntries().map(function (e) { return [e.date, e.amount < 0 ? "refund" : "income", e.source, e.amount, e.note]; })
    .concat(expenses.map(function (e) { return [e.date, "expense", e.source, e.amount, e.note || ""]; }))
    .sort(function (a, b) { return String(a[0]).localeCompare(String(b[0])); });
  downloadCSV("growmypin_money_" + todayKey() + ".csv", ["Date", "Type", "Source", "Amount", "Note"], rows);
}

// ================= Toast =================
var toastTimer = null;
function toast(msg, isErr) {
  var t = document.getElementById("toast");
  t.innerHTML = (isErr ? '<span style="color:#ff8a8a;display:inline-flex">' + icon("alert") + '</span>' : icon("check")) + esc(msg);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
}

// ================= Keyboard =================
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (document.getElementById("modalWrap")) closeModal();
  else if (ui.openClientId) closeClient();
});

// ================= Auth lock (Supabase Auth) =================
var appStarted = false;
document.getElementById("authLogo").innerHTML = LOGO_SVG_LIGHT;
document.getElementById("headLogo").innerHTML = LOGO_SVG;
document.getElementById("logoutBtn").innerHTML = icon("lock") + '<span class="hide-m">Lock</span>';

function showAuth() {
  document.getElementById("authLoading").classList.add("hidden");
  document.getElementById("appRoot").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
  closeModal();
  setTimeout(function () { document.getElementById("loginPassword").focus(); }, 50);
}
function showApp() {
  document.getElementById("authLoading").classList.add("hidden");
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appRoot").classList.remove("hidden");
}
function startApp() {
  if (appStarted) return;
  appStarted = true;
  renderNav();
  document.getElementById("view-overview").innerHTML = '<div class="loading" style="min-height:50vh"><div><div class="spinner"></div>Loading your clients...</div></div>';
  loadAll().then(function () {
    setSync("saved");
    go("overview");
  }).catch(function (e) {
    console.error(e);
    setSync("error");
    document.getElementById("view-overview").innerHTML = '<div class="card"><div class="empty-state"><div class="e-ic" style="background:var(--bad-soft);color:var(--bad)">' + icon("alert") + '</div><b>Could not load data</b>Check your internet and refresh the page.</div></div>';
  });
}

document.getElementById("loginForm").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var pw = document.getElementById("loginPassword").value;
  var errEl = document.getElementById("loginErr");
  var btn = document.getElementById("loginBtn");
  errEl.textContent = "";
  if (!pw) { errEl.textContent = "Enter your password."; return; }
  btn.disabled = true;
  btn.textContent = "Unlocking...";
  sb.auth.signInWithPassword({ email: LOCK_EMAIL, password: pw }).then(function (res) {
    btn.disabled = false;
    btn.textContent = "Unlock";
    if (res.error) {
      errEl.textContent = "Wrong password. Try again.";
      document.getElementById("loginPassword").value = "";
      document.getElementById("loginPassword").focus();
    }
  }).catch(function (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = "Unlock";
    errEl.textContent = "Connection problem. Check your internet.";
  });
});

// Lock again if the app was in the background for too long
var hiddenAt = 0;
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") hiddenAt = Date.now();
  else if (hiddenAt && appStarted && (Date.now() - hiddenAt) >= LOCK_AFTER_HIDDEN_MS) window.location.reload();
});

document.getElementById("logoutBtn").addEventListener("click", function () {
  sb.auth.signOut().then(function () { window.location.reload(); });
});

sb.auth.onAuthStateChange(function (event, session) {
  if (session) {
    showApp();
    setTimeout(startApp, 0);
  } else if (event === "SIGNED_OUT" && appStarted) {
    window.location.reload();
  } else {
    showAuth();
  }
});
</script>
